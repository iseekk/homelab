x-base: &base
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "5m"
      max-file: "2"

services:
  tailscale:
    <<: *base
    image: tailscale/tailscale:v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
    container_name: tailscale
    hostname: homelab
    environment:
      - TZ
      - TS_AUTHKEY
      - TS_STATE_DIR
      - TS_EXTRA_ARGS
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./ts-data:/var/lib/tailscale

  vaultwarden:
    <<: *base
    image: vaultwarden/server:1.37.5@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f
    container_name: vaultwarden
    user: 1000:1000
    network_mode: "service:tailscale"
    environment:
      - TZ
      - DOMAIN
      - INVITATIONS_ALLOWED
      - SIGNUPS_ALLOWED
    volumes:
      - ./vw-data:/data
    depends_on:
      - tailscale

  scheduler:
    <<: *base
    build:
      context: ./scheduler
      dockerfile: Dockerfile
    container_name: scheduler
    environment:
      - TZ
      - ARCHIVE_PASSWORD
      - BACKUP_TIMES
      - RETENTION_DAILY_DAYS
      - RETENTION_WEEKLY_DAYS
      - RETENTION_MONTHLY_DAYS
      - S3_BUCKET
      - S3_PREFIX
      - S3_REGION
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - HEALTHCHECKS_PING_URL
    volumes:
      - ./vw-data:/data:ro
      - ./backups:/app/backups
    depends_on:
      - vaultwarden
