x-base: &base
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "5m"
      max-file: "2"

services:
  tailscale:
    <<: *base
    image: tailscale/tailscale:v1.104.1
    container_name: tailscale
    hostname: homelab
    volumes:
      - ./ts-data:/var/lib/tailscale
    environment:
      - TZ
      - TS_AUTHKEY
      - TS_STATE_DIR
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW

  vaultwarden:
    <<: *base
    image: vaultwarden/server:1.37.4
    container_name: vaultwarden
    network_mode: "service:tailscale"
    environment:
      - TZ
      - DOMAIN
      - INVITATIONS_ALLOWED
      - SIGNUPS_ALLOWED
    volumes:
      - ./vw-data:/data
    depends_on:
      - tailscale

  scheduler:
    <<: *base
    build:
      context: ./scheduler
      dockerfile: Dockerfile
    container_name: scheduler
    environment:
      - TZ
      - ARCHIVE_PASSWORD
      - BACKUP_TIMES
      - RETENTION_DAILY_DAYS
      - RETENTION_WEEKLY_DAYS
      - RETENTION_MONTHLY_DAYS
      - S3_BUCKET
      - S3_PREFIX
      - S3_REGION
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - HEALTHCHECKS_PING_URL
    volumes:
      - ./vw-data:/data:ro
      - ./backups:/app/backups
    depends_on:
      - vaultwarden
