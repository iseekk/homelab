[project]
name = "homelab-scheduler"
version = "0.1.0"
description = "Automated Vaultwarden backup scheduler."
requires-python = ">=3.14"
dependencies = [
    "boto3==1.43.50",
    "boto3-stubs[s3]==1.43.50",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "py7zr==1.1.3",
    "schedule==1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scheduler"]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "ANN", # type annotation
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "D",   # pydocstyle
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "PTH", # use `pathlib.Path` instead of `os.path`
    "RUF", # ruff specific rules
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = [
    "D1",   # missing docstring in public module, class, function or method
    "D203",
    "D213",
]

[tool.ruff.lint.isort]
known-first-party = ["scheduler"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
no_implicit_reexport = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "py7zr.*", "schedule.*"]
ignore_missing_imports = true
