[project]
name = "homelab-scheduler"
version = "0.1.0"
description = "Automated Vaultwarden backup scheduler."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3==1.43.21",
    "boto3-stubs[s3]==1.43.21",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "py7zr==1.1.0",
    "schedule==1.2.2",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.14",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.14"
strict = true
