name: CI

on:
  pull_request:
    paths:
      - 'scheduler/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'scheduler/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  scheduler:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scheduler

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "scheduler/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run --no-sync ruff format --check
          uv run --no-sync ruff check

      - name: Typecheck
        run: uv run --no-sync mypy .

      - name: Test
        run: uv run --no-sync pytest -vv --tb=short --cov=src --cov-report=term-missing tests
